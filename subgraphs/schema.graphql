"""
Running protocol-wide totals. Singleton entity — always loaded/saved with
id "protocol". totalPrincipalEther is read directly from the contract's own
totalPrincipalEther() view on every update (rather than reconstructed from
event deltas) because the Withdrawn event only reports the Ether actually
received from burning rETH, not the exact principal reduced — those can
differ by a rounding wei, so summing event fields would drift from the real
on-chain value over time. totalYieldDonatedReth *is* safe to accumulate from
YieldAllocated's rethAmount, since that field is the exact atomic amount the
contract added to a cause's totalHarvestedReth.
"""
type Protocol @entity(immutable: false) {
	id: Bytes!
	totalPrincipalEther: BigInt!
	totalYieldDonatedReth: BigInt!
	causeCount: BigInt!
	patronCount: BigInt!
}

"""
One row per unique address that has ever deposited. The contract itself has
no patron counter or enumeration (`patrons` is just a mapping) — this is how
we count patrons at all: created on a patron's first Deposited event (covers
both deposit() and depositReth(), which both emit it). `active` tracks
whether they currently still have a position — checked against the
contract's own patrons(address).rethBalance after every Withdrawn/
WithdrawnReth event, since a partial withdrawal leaves them active but a
full exit zeroes it out. Protocol.patronCount only counts active patrons,
incremented/decremented as this flips — not a lifetime "ever participated"
total.
"""
type Patron @entity(immutable: false) {
	id: Bytes!
	firstDepositTimestamp: BigInt!
	active: Boolean!
}

"""
One row per UTC day (id = day number since epoch). Upserted every time a
relevant event fires that day, so it always reflects the Protocol totals as
of the end of that day. Query a range of these, ordered by dayId, to chart
TVL / yield-donated over time.
"""
type DailySnapshot @entity(immutable: false) {
	id: Bytes!
	dayId: Int!
	dayStartTimestamp: BigInt!
	totalPrincipalEther: BigInt!
	totalYieldDonatedReth: BigInt!
}
